<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Despesas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Despesas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f5e57">
<style>
:root{--bg:#f3f4f2;--cd:#fff;--tx:#161a19;--mu:#68716e;--ac:#0f5e57;--on:#fff;--rd:#c0392b;--gn:#17803d;--bd:#dfe3e0}
@media(prefers-color-scheme:dark){:root{--bg:#0e1211;--cd:#171d1c;--tx:#e8eeec;--mu:#8e9a96;--ac:#3fc6b6;--on:#06201c;--rd:#f48771;--gn:#5fd68a;--bd:#2a3330}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(96px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
.w{max-width:640px;margin:0 auto;padding:0 14px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0 8px}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.2px}
h2{margin:0 0 12px;font-size:19px}
h3{display:flex;justify-content:space-between;font-size:14px;font-weight:600;color:var(--mu);margin:18px 2px 6px;text-transform:capitalize}
button,input,select{font:inherit;color:inherit}
button{border:1px solid var(--bd);background:var(--cd);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.ib{width:44px;padding:0;font-size:22px;line-height:1}
.pr{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
.dg{color:var(--rd)}
input,select{width:100%;min-height:44px;padding:9px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);font-size:16px;-webkit-appearance:none;appearance:none}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:10px}
label input,label select{margin-top:4px;color:var(--tx)}
.chk{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--tx)}
.chk input{width:22px;min-height:22px;margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.two label{margin:0}
.seg{display:grid;grid-template-columns:repeat(5,1fr);background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{border:0;background:none;min-height:38px;padding:8px 2px;font-size:14px}
.tp{grid-template-columns:1fr 1fr}.tp .on[data-t=d]{background:var(--rd)}.tp .on[data-t=r]{background:var(--gn)}
.seg .on{background:var(--ac);color:var(--on);font-weight:600}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav input{flex:1;width:auto;margin:0 8px;text-align:center;font-weight:600}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.sum div{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:10px}
.sum small{display:block;color:var(--mu);font-size:12px}
.sum b{font-size:15px;font-variant-numeric:tabular-nums}
.sum .tot{grid-column:1/-1}.sum .tot b{font-size:26px}.sum .pos{border-color:var(--gn)}.sum .pos b{color:var(--gn)}.sum .neg{border-color:var(--rd)}.sum .neg b{color:var(--rd)}.gr{color:var(--gn)}.rd{color:var(--rd)}.c0{margin:6px 2px 10px;text-align:center}#fl2 .two{margin-top:10px}
.r{display:flex;align-items:center;gap:10px;background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:6px}
.r.ok .m{opacity:.55}
.ck{flex:none;width:34px;min-height:34px;height:34px;padding:0;border-radius:50%;font-weight:700;color:var(--on)}
.r.ok .ck{background:var(--gn);border-color:var(--gn)}
.m{flex:1;min-width:0}
.m b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m small{display:block;color:var(--mu);font-size:12.5px}
.late{color:var(--rd)!important;font-weight:600}
.v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.v small{display:block;color:var(--mu);font-weight:400;font-size:12.5px}
.mu{color:var(--mu);font-size:13px}.c{text-align:center;padding:28px 0}
details{margin-top:18px;background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
summary{cursor:pointer;font-weight:600}
.bi{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:6px;padding:7px 0;border-top:1px solid var(--bd);font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right}.bi span:first-child{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hd{color:var(--mu);font-size:11.5px}
.bi:first-of-type{margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 10px}.ch{min-height:36px;padding:5px 12px;border-radius:18px;font-size:14px}.ch.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.m .cat{color:var(--ac);font-weight:600}
#fab{position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:30px;font-size:32px;padding:0;box-shadow:0 4px 14px #0004}
dialog{width:min(92vw,460px);max-height:92vh;border:0;border-radius:16px;padding:18px;background:var(--cd);color:var(--tx)}
dialog::backdrop{background:#0009}
dialog>button,#f>.two button{width:100%}
#mu button{display:block;margin-bottom:8px}
</style>
</head>
<body>
<div class="w">
<header><h1>Finanças</h1><button id="mn" class="ib" aria-label="Backup e opções">⋯</button></header>
<div class="seg" id="sg" role="group" aria-label="Tipo de consulta"><button data-m="d">Dia</button><button data-m="m" class="on">Mês</button><button data-m="a">Ano</button><button data-m="p">Período</button><button data-m="t">Tudo</button></div>
<div id="pm" class="nav"><button id="pv" class="ib" aria-label="Mês anterior">‹</button><input id="jp" aria-label="Escolher data"><button id="nx" class="ib" aria-label="Próximo mês">›</button></div>
<div id="pp" class="two" hidden><label>De<input type="date" id="de"></label><label>Até<input type="date" id="ate"></label></div>
<section class="sum"><div id="sv0" class="tot pos"><small id="sl">Saldo</small><b id="s3"></b></div><div><small>Receitas</small><b id="s1" class="gr"></b></div><div><small>Despesas</small><b id="s2" class="rd"></b></div></section>
<p id="s4" class="mu c0"></p>
<details id="fl2"><summary>Filtros e busca</summary>
<input id="q" type="search" placeholder="Buscar por item ou categoria" aria-label="Buscar" style="margin-top:10px">
<div class="two"><label>Tipo<select id="ty"><option value="">Receitas e despesas</option><option value="r">Só receitas</option><option value="d">Só despesas</option></select></label><label>Situação<select id="st"><option value="">Todas</option><option value="pe">Pendentes</option><option value="pg">Quitadas</option><option value="vc">Atrasadas</option></select></label></div>
<div class="two"><label>Categoria<select id="fc"><option value="">Todas</option></select></label><label>Datas por<select id="bs"><option value="venc">Vencimento</option><option value="inc">Inclusão</option></select></label></div>
</details>
<main id="ls"></main>
<details><summary>Relatório</summary><label style="margin-top:10px">Agrupar por<select id="rg"><option value="c">Categoria</option><option value="i">Item</option><option value="m">Mês</option><option value="a">Ano</option></select></label><div id="bl"></div></details>
</div>
<button id="fab" class="pr" aria-label="Nova despesa">+</button>

<dialog id="fm"><form id="f">
<div class="seg tp" id="tp"><button type="button" data-t="d" class="on">Despesa</button><button type="button" data-t="r">Receita</button></div>
<h2 id="ft2">Nova despesa</h2>
<label>Item<input id="fi" list="il" maxlength="80" autocomplete="off" placeholder="Ex.: Geladeira"></label><datalist id="il"></datalist>
<label>Categoria (opcional)<input id="fk" maxlength="40" autocomplete="off" placeholder="Ex.: Cartão Visa"></label><div id="kc" class="chips"></div>
<div class="two"><label>Valor (R$)<input id="fv" inputmode="decimal" placeholder="0,00"></label><label id="lt">O valor é<select id="ft"><option value="p">de cada parcela</option><option value="t">total</option></select></label></div>
<div class="two"><label id="ln">Parcelas<input id="fn" type="number" min="1" max="60" value="1" inputmode="numeric"></label><label><span id="lv">1º vencimento</span><input id="fd" type="date"></label></div>
<label>Data de inclusão<input id="fx" type="date"></label>
<label id="lp" class="chk" hidden><input id="fp" type="checkbox"> <span id="lpd">Paga</span></label>
<label id="la" class="chk" hidden><input id="fa" type="checkbox" checked> Mudar item, categoria e tipo em todas as parcelas</label>
<p id="pw" class="mu"></p>
<div class="two"><button type="button" id="cn">Cancelar</button><button class="pr" id="sv">Salvar</button></div>
<div class="two"><button type="button" id="x1" class="dg" hidden>Excluir esta parcela</button><button type="button" id="x2" class="dg" hidden>Excluir todas as parcelas</button></div>
</form></dialog>

<dialog id="mu"><h2>Dados</h2>
<button id="m1">Fazer backup (arquivo)</button>
<button id="m2">Restaurar backup</button>
<button id="m3">Exportar consulta atual (CSV)</button>
<button id="m4" class="dg">Apagar todos os dados</button>
<button id="m0">Fechar</button>
<p class="mu">Os dados ficam só neste aparelho. Faça backup com frequência.</p></dialog>
<input type="file" id="fl" accept="application/json,.json" hidden>

<script>
const $=s=>document.querySelector(s),K='despesas.v1',pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),today=()=>iso(new Date());
const brl=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fdt=s=>s.split('-').reverse().join('/');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const mlabel=k=>{const[y,m]=k.split('-');return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})};
function money(s){s=String(s).replace(/[^\d.,]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');const v=parseFloat(s);return isFinite(v)?Math.round(v*100):0}
function addM(s,n){const[y,m,d]=s.split('-').map(Number),i=m-1+n,y2=y+Math.floor(i/12),m2=((i%12)+12)%12;return y2+'-'+pad(m2+1)+'-'+pad(Math.min(d,new Date(y2,m2+1,0).getDate()))}
let D=[];try{D=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){localStorage.setItem(K+'.bak',localStorage.getItem(K))}
const save=()=>localStorage.setItem(K,JSON.stringify(D));
let mode='m',cur=today(),eid=null,tp='d',cr=null;

const cats=()=>[...new Set(D.map(r=>r.cat).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
const normCat=s=>{s=s.trim().replace(/\s+/g,' ');return cats().find(c=>c.toLowerCase()===s.toLowerCase())||s};
const isR=r=>r.t==='r',addD=(s,n)=>{const[y,m,d]=s.split('-').map(Number);return iso(new Date(y,m-1,d+n))};
function filt(){
 const q=$('#q').value.trim().toLowerCase(),st=$('#st').value,b=$('#bs').value,a=$('#de').value,z=$('#ate').value,t=today(),kc=$('#fc').value,ty=$('#ty').value;
 return D.filter(r=>{const dt=r[b];
  if(mode==='d'&&dt!==cur)return false;
  if(mode==='m'&&dt.slice(0,7)!==cur.slice(0,7))return false;
  if(mode==='a'&&dt.slice(0,4)!==cur.slice(0,4))return false;
  if(mode==='p'&&((a&&dt<a)||(z&&dt>z)))return false;
  if(q&&!(r.item+' '+(r.cat||'')).toLowerCase().includes(q))return false;
  if(ty&&(ty==='r')!==isR(r))return false;
  if(kc==='__sem'&&r.cat)return false;
  if(kc&&kc!=='__sem'&&r.cat!==kc)return false;
  if(st==='pg'&&!r.pago)return false;
  if(st==='pe'&&r.pago)return false;
  if(st==='vc'&&(r.pago||r.venc>=t))return false;
  return true}).sort((x,y)=>x[b].localeCompare(y[b])||x.item.localeCompare(y.item)||x.p-y.p);
}
function render(){
 {const cs=cats(),sv=$('#fc').value;$('#fc').innerHTML='<option value="">Todas</option>'+(cs.length&&D.some(r=>!r.cat)?'<option value="__sem">Sem categoria</option>':'')+cs.map(k=>`<option value="${esc(k)}">${esc(k)}</option>`).join('');$('#fc').value=sv;if($('#fc').selectedIndex<0)$('#fc').value=''}
 $('#pm').hidden=mode==='p'||mode==='t';$('#pp').hidden=mode!=='p';
 if(!$('#pm').hidden){const j=$('#jp');j.type=mode==='d'?'date':mode==='m'?'month':'number';j.value=mode==='d'?cur:mode==='m'?cur.slice(0,7):cur.slice(0,4)}
 document.querySelectorAll('#sg button').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
 
 const L=filt(),b=$('#bs').value,t=today();let tr=0,td=0,rr=0,dp=0,h='',last='',sub={};
 L.forEach(r=>{const R=isR(r),k=r[b].slice(0,7);if(R){tr+=r.val;if(r.pago)rr+=r.val}else{td+=r.val;if(r.pago)dp+=r.val}sub[k]=(sub[k]||0)+(R?r.val:-r.val)});
 L.forEach(r=>{const R=isR(r),k=r[b].slice(0,7);
  if(mode!=='m'&&mode!=='d'&&k!==last){last=k;h+=`<h3><span>${mlabel(k)}</span><span>${brl(sub[k])}</span></h3>`}
  const late=!r.pago&&r.venc<t;
  h+=`<div class="r${r.pago?' ok':''}"><button class="ck" data-ck="${r.id}" aria-label="Marcar como quitada">${r.pago?'✓':''}</button><div class="m" data-ed="${r.id}"><b>${esc(r.item)}</b>${r.cat?`<small class="cat">${esc(r.cat)}</small>`:''}<small${late?' class="late"':''}>${R?'Recebe em':'Vence em'} ${fdt(r.venc)}${late?' · atrasada':''}</small><small>Incluída em ${fdt(r.inc)}</small></div><div class="v${R?' gr':''}">${R?'+':'−'}${brl(r.val)}<small>${r.p}/${r.n}</small></div></div>`});
 $('#ls').innerHTML=h||'<p class="mu c">Nada encontrado nesta consulta.<br>Toque em + para incluir.</p>';
 const sd=tr-td;$('#s1').textContent=brl(tr);$('#s2').textContent=brl(td);$('#s3').textContent=brl(sd);
 $('#sv0').className='tot '+(sd<0?'neg':'pos');$('#sl').textContent=sd<0?'Saldo negativo':'Saldo positivo';
 $('#s4').textContent=`Realizado ${brl(rr-dp)} · A receber ${brl(tr-rr)} · A pagar ${brl(td-dp)}`;
 const g=$('#rg').value,gk={c:r=>r.cat||'Sem categoria',i:r=>r.item,m:r=>r[b].slice(0,7),a:r=>r[b].slice(0,4)}[g],G={};
 L.forEach(r=>{const k=gk(r),o=G[k]||(G[k]={r:0,d:0});if(isR(r))o.r+=r.val;else o.d+=r.val});
 const E=Object.entries(G).sort((x,y)=>g==='m'||g==='a'?x[0].localeCompare(y[0]):(y[1].r+y[1].d)-(x[1].r+x[1].d)),row=(n,a,d)=>`<div class="bi"><span>${esc(n)}</span><span class="gr">${brl(a)}</span><span class="rd">${brl(d)}</span><b class="${a-d<0?'rd':'gr'}">${brl(a-d)}</b></div>`;
 $('#bl').innerHTML=E.length?'<div class="bi hd"><span></span><span>Receitas</span><span>Despesas</span><span>Saldo</span></div>'+E.map(([k,o])=>row(g==='m'?mlabel(k):k,o.r,o.d)).join('')+row('Total',tr,td):'<p class="mu">Sem dados.</p>';
 $('#il').innerHTML=[...new Set(D.map(r=>r.item))].sort().map(k=>`<option value="${esc(k)}">`).join('');
}
document.querySelectorAll('#sg button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;render()});
const step=n=>{cur=mode==='d'?addD(cur,n):addM(cur,mode==='a'?12*n:n);render()};
$('#pv').onclick=()=>step(-1);
$('#nx').onclick=()=>step(1);
$('#jp').onchange=e=>{const v=e.target.value;if(!v)return;cur=mode==='d'?v:mode==='m'?v+'-01':v.padStart(4,'0')+'-01-01';render()};
['#q','#st','#bs','#de','#ate','#fc','#ty','#rg'].forEach(s=>['input','change'].forEach(ev=>$(s).addEventListener(ev,render)));
$('#ls').onclick=e=>{const c=e.target.closest('[data-ck]'),d=e.target.closest('[data-ed]');
 if(c){const r=D.find(x=>x.id===c.dataset.ck);r.pago=!r.pago;save();render()}else if(d)openF(D.find(x=>x.id===d.dataset.ed))};

function pw(){
 if(eid){$('#pw').textContent='';return}
 const n=Math.max(1,Math.min(60,+$('#fn').value||1)),c=money($('#fv').value),d=$('#fd').value,tt=$('#ft').value==='t';
 if(!c||!d){$('#pw').textContent='';return}
 $('#pw').textContent=`${n}× ${brl(tt?Math.floor(c/n):c)} · ${fdt(d)}${n>1?' a '+fdt(addM(d,n-1)):''} · total ${brl(tt?c:c*n)}`;
}
['#fv','#ft','#fn','#fd'].forEach(s=>$(s).addEventListener('input',pw));
function openF(r){
 const e=!!r;eid=e?r.id:null;
 tp=e?(r.t||'d'):'d';cr=r;
 $('#fi').value=e?r.item:'';$('#fk').value=e?(r.cat||''):'';$('#fv').value=e?(r.val/100).toFixed(2).replace('.',','):'';
 $('#fd').value=e?r.venc:today();$('#fx').value=e?r.inc:today();$('#fn').value=1;$('#ft').value='p';
 
 $('#fp').checked=e&&r.pago;$('#lt').hidden=$('#ln').hidden=e;$('#lp').hidden=!e;
 const g=e?D.filter(x=>x.g===r.g).length:0;
 $('#la').hidden=g<2;$('#x1').hidden=!e;$('#x2').hidden=g<2;
 ui();pw();chips();$('#fm').showModal();
}
function ui(){const R=tp==='r';document.querySelectorAll('#tp button').forEach(b=>b.classList.toggle('on',b.dataset.t===tp));$('#ft2').textContent=(eid?'Editar ':'Nova ')+(R?'receita':'despesa');$('#lv').textContent=eid?`${R?'Recebimento':'Vencimento'} (parcela ${cr.p}/${cr.n})`:(R?'1º recebimento':'1º vencimento');$('#lpd').textContent=R?'Recebida':'Paga'}
$('#tp').onclick=e=>{const b=e.target.closest('[data-t]');if(b){tp=b.dataset.t;ui()}};
function chips(){const v=$('#fk').value.trim().toLowerCase();$('#kc').innerHTML=cats().map(k=>`<button type="button" class="ch${k.toLowerCase()===v?' on':''}" data-k="${esc(k)}">${esc(k)}</button>`).join('')}
$('#fk').addEventListener('input',chips);
$('#kc').onclick=e=>{const b=e.target.closest('[data-k]');if(b){$('#fk').value=b.dataset.k;chips()}};
$('#fab').onclick=()=>openF(null);
$('#cn').onclick=()=>$('#fm').close();
$('#f').onsubmit=e=>{
 e.preventDefault();
 const item=$('#fi').value.trim(),c=money($('#fv').value),d=$('#fd').value,inc=$('#fx').value||today(),cat=normCat($('#fk').value);
 if(!item||!c||!d)return alert('Preencha item, valor e vencimento.');
 if(eid){
  const r=D.find(x=>x.id===eid);Object.assign(r,{val:c,venc:d,inc,cat,t:tp,pago:$('#fp').checked});
  if(!$('#la').hidden&&$('#fa').checked)D.forEach(x=>{if(x.g===r.g){x.item=item;x.cat=cat;x.t=tp}});else r.item=item;
 }else{
  const n=Math.max(1,Math.min(60,+$('#fn').value||1)),tt=$('#ft').value==='t',b=tt?Math.floor(c/n):c,ex=tt?c-b*n:0,g=uid();
  for(let i=0;i<n;i++)D.push({id:g+i,g,t:tp,item,cat,inc,venc:addM(d,i),val:b+(i<ex?1:0),p:i+1,n,pago:false});
  if(mode==='p')mode='m';cur=d;$('#bs').value='venc';$('#q').value='';$('#st').value='';$('#fc').value='';$('#ty').value='';
 }
 save();$('#fm').close();render();
};
$('#x1').onclick=()=>{if(confirm('Excluir esta parcela?')){D=D.filter(x=>x.id!==eid);save();$('#fm').close();render()}};
$('#x2').onclick=()=>{const g=D.find(x=>x.id===eid).g;if(confirm('Excluir TODAS as parcelas desta despesa?')){D=D.filter(x=>x.g!==g);save();$('#fm').close();render()}};

async function out(n,t,x){
 const f=new File([x],n,{type:t});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(e){if(e.name==='AbortError')return}}
 const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=n;a.click();
}
$('#mn').onclick=()=>$('#mu').showModal();
$('#m0').onclick=()=>$('#mu').close();
$('#m1').onclick=()=>out('despesas-backup-'+today()+'.json','application/json',JSON.stringify(D));
$('#m2').onclick=()=>$('#fl').click();
$('#m3').onclick=()=>{
 const r=['Tipo;Inclusão;Item;Categoria;Vencimento;Valor;Parcela;Situação',...filt().map(x=>[isR(x)?'Receita':'Despesa',fdt(x.inc),'"'+x.item.replace(/"/g,'""')+'"','"'+(x.cat||'').replace(/"/g,'""')+'"',fdt(x.venc),(x.val/100).toFixed(2).replace('.',','),x.p+'/'+x.n,x.pago?'Quitada':'Pendente'].join(';'))];
 out('despesas-'+today()+'.csv','text/csv','\ufeff'+r.join('\r\n'));
};
$('#m4').onclick=()=>{if(confirm('Apagar TODOS os dados deste aparelho?')&&confirm('Tem certeza? Não dá para desfazer.')){D=[];save();$('#mu').close();render()}};
$('#fl').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 try{const a=JSON.parse(await f.text());if(!Array.isArray(a))throw 0;
  const ids=new Set(D.map(x=>x.id));let n=0;
  a.forEach(x=>{if(x&&x.id&&x.item&&x.venc&&x.inc&&Number.isInteger(x.val)&&!ids.has(x.id)){D.push(x);n++}});
  save();render();alert(n+' lançamentos restaurados.');
 }catch(_){alert('Arquivo de backup inválido.')}
 e.target.value='';$('#mu').close();
};
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
</script>
</body>
