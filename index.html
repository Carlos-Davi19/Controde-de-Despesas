<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Despesas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Despesas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f5e57">
<style>
:root{--bg:#f3f4f2;--cd:#fff;--tx:#161a19;--mu:#68716e;--ac:#0f5e57;--on:#fff;--rd:#c0392b;--gn:#17803d;--bd:#dfe3e0}
@media(prefers-color-scheme:dark){:root{--bg:#0e1211;--cd:#171d1c;--tx:#e8eeec;--mu:#8e9a96;--ac:#3fc6b6;--on:#06201c;--rd:#f48771;--gn:#5fd68a;--bd:#2a3330}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(96px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
.w{max-width:640px;margin:0 auto;padding:0 14px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0 8px}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.2px}
h2{margin:0 0 12px;font-size:19px}
h3{display:flex;justify-content:space-between;font-size:14px;font-weight:600;color:var(--mu);margin:18px 2px 6px;text-transform:capitalize}
button,input,select{font:inherit;color:inherit}
button{border:1px solid var(--bd);background:var(--cd);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.ib{width:44px;padding:0;font-size:22px;line-height:1}
.pr{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
.dg{color:var(--rd)}
input,select{width:100%;min-height:44px;padding:9px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);font-size:16px;-webkit-appearance:none;appearance:none}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:10px}
label input,label select{margin-top:4px;color:var(--tx)}
.chk{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--tx)}
.chk input{width:22px;min-height:22px;margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.two label{margin:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{border:0;background:none;min-height:38px}
.seg .on{background:var(--ac);color:var(--on);font-weight:600}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav b{text-transform:capitalize;font-size:18px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0}
.sum div{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:10px}
.sum small{display:block;color:var(--mu);font-size:12px}
.sum b{font-size:15px;font-variant-numeric:tabular-nums}
#s3{color:var(--rd)}#s2{color:var(--gn)}
.r{display:flex;align-items:center;gap:10px;background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:6px}
.r.ok .m{opacity:.55}
.ck{flex:none;width:34px;min-height:34px;height:34px;padding:0;border-radius:50%;font-weight:700;color:var(--on)}
.r.ok .ck{background:var(--gn);border-color:var(--gn)}
.m{flex:1;min-width:0}
.m b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m small{display:block;color:var(--mu);font-size:12.5px}
.late{color:var(--rd)!important;font-weight:600}
.v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.v small{display:block;color:var(--mu);font-weight:400;font-size:12.5px}
.mu{color:var(--mu);font-size:13px}.c{text-align:center;padding:28px 0}
details{margin-top:18px;background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
summary{cursor:pointer;font-weight:600}
.bi{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--bd);font-size:15px}
.bi:first-of-type{margin-top:8px}
#fab{position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:30px;font-size:32px;padding:0;box-shadow:0 4px 14px #0004}
dialog{width:min(92vw,460px);max-height:92vh;border:0;border-radius:16px;padding:18px;background:var(--cd);color:var(--tx)}
dialog::backdrop{background:#0009}
dialog>button,#f>.two button{width:100%}
#mu button{display:block;margin-bottom:8px}
</style>
</head>
<body>
<div class="w">
<header><h1>Despesas</h1><button id="mn" class="ib" aria-label="Backup e opções">⋯</button></header>
<div class="seg" role="group" aria-label="Tipo de consulta"><button data-m="m" class="on">Mês</button><button data-m="p">Período</button><button data-m="t">Tudo</button></div>
<div id="pm" class="nav"><button id="pv" class="ib" aria-label="Mês anterior">‹</button><b id="ml"></b><button id="nx" class="ib" aria-label="Próximo mês">›</button></div>
<div id="pp" class="two" hidden><label>De<input type="date" id="de"></label><label>Até<input type="date" id="ate"></label></div>
<div class="two"><input id="q" type="search" placeholder="Buscar item" aria-label="Buscar item"><select id="st" aria-label="Situação"><option value="">Todas</option><option value="pe">Pendentes</option><option value="pg">Pagas</option><option value="vc">Vencidas</option></select></div>
<label>Filtrar datas por<select id="bs"><option value="venc">Vencimento</option><option value="inc">Inclusão</option></select></label>
<section class="sum"><div><small>Total</small><b id="s1"></b></div><div><small>Pago</small><b id="s2"></b></div><div><small>A pagar</small><b id="s3"></b></div></section>
<main id="ls"></main>
<details><summary>Total por item</summary><div id="bl"></div></details>
</div>
<button id="fab" class="pr" aria-label="Nova despesa">+</button>

<dialog id="fm"><form id="f">
<h2 id="ft2">Nova despesa</h2>
<label>Item<input id="fi" list="il" maxlength="80" autocomplete="off" placeholder="Ex.: Geladeira"></label><datalist id="il"></datalist>
<div class="two"><label>Valor (R$)<input id="fv" inputmode="decimal" placeholder="0,00"></label><label id="lt">O valor é<select id="ft"><option value="p">de cada parcela</option><option value="t">total</option></select></label></div>
<div class="two"><label id="ln">Parcelas<input id="fn" type="number" min="1" max="60" value="1" inputmode="numeric"></label><label><span id="lv">1º vencimento</span><input id="fd" type="date"></label></div>
<label>Data de inclusão<input id="fx" type="date"></label>
<label id="lp" class="chk" hidden><input id="fp" type="checkbox"> Pago</label>
<label id="la" class="chk" hidden><input id="fa" type="checkbox" checked> Mudar o nome em todas as parcelas</label>
<p id="pw" class="mu"></p>
<div class="two"><button type="button" id="cn">Cancelar</button><button class="pr" id="sv">Salvar</button></div>
<div class="two"><button type="button" id="x1" class="dg" hidden>Excluir esta parcela</button><button type="button" id="x2" class="dg" hidden>Excluir todas as parcelas</button></div>
</form></dialog>

<dialog id="mu"><h2>Dados</h2>
<button id="m1">Fazer backup (arquivo)</button>
<button id="m2">Restaurar backup</button>
<button id="m3">Exportar consulta atual (CSV)</button>
<button id="m4" class="dg">Apagar todos os dados</button>
<button id="m0">Fechar</button>
<p class="mu">Os dados ficam só neste aparelho. Faça backup com frequência.</p></dialog>
<input type="file" id="fl" accept="application/json,.json" hidden>

<script>
const $=s=>document.querySelector(s),K='despesas.v1',pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),today=()=>iso(new Date());
const brl=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fdt=s=>s.split('-').reverse().join('/');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const mlabel=k=>{const[y,m]=k.split('-');return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})};
function money(s){s=String(s).replace(/[^\d.,]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');const v=parseFloat(s);return isFinite(v)?Math.round(v*100):0}
function addM(s,n){const[y,m,d]=s.split('-').map(Number),i=m-1+n,y2=y+Math.floor(i/12),m2=((i%12)+12)%12;return y2+'-'+pad(m2+1)+'-'+pad(Math.min(d,new Date(y2,m2+1,0).getDate()))}
let D=[];try{D=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){localStorage.setItem(K+'.bak',localStorage.getItem(K))}
const save=()=>localStorage.setItem(K,JSON.stringify(D));
let mode='m',cur=today().slice(0,7),eid=null;

function filt(){
 const q=$('#q').value.trim().toLowerCase(),st=$('#st').value,b=$('#bs').value,a=$('#de').value,z=$('#ate').value,t=today();
 return D.filter(r=>{const dt=r[b];
  if(mode==='m'&&dt.slice(0,7)!==cur)return false;
  if(mode==='p'&&((a&&dt<a)||(z&&dt>z)))return false;
  if(q&&!r.item.toLowerCase().includes(q))return false;
  if(st==='pg'&&!r.pago)return false;
  if(st==='pe'&&r.pago)return false;
  if(st==='vc'&&(r.pago||r.venc>=t))return false;
  return true}).sort((x,y)=>x[b].localeCompare(y[b])||x.item.localeCompare(y.item)||x.p-y.p);
}
function render(){
 $('#pm').hidden=mode!=='m';$('#pp').hidden=mode!=='p';
 document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
 $('#ml').textContent=mlabel(cur);
 const L=filt(),b=$('#bs').value,t=today();let tot=0,pg=0,h='',last='',sub={},it={};
 L.forEach(r=>{tot+=r.val;if(r.pago)pg+=r.val;const k=r[b].slice(0,7);sub[k]=(sub[k]||0)+r.val;it[r.item]=(it[r.item]||0)+r.val});
 L.forEach(r=>{const k=r[b].slice(0,7);
  if(mode!=='m'&&k!==last){last=k;h+=`<h3><span>${mlabel(k)}</span><span>${brl(sub[k])}</span></h3>`}
  const late=!r.pago&&r.venc<t;
  h+=`<div class="r${r.pago?' ok':''}"><button class="ck" data-ck="${r.id}" aria-label="Marcar como paga">${r.pago?'✓':''}</button><div class="m" data-ed="${r.id}"><b>${esc(r.item)}</b><small${late?' class="late"':''}>Vence em ${fdt(r.venc)}${late?' · vencida':''}</small><small>Incluída em ${fdt(r.inc)}</small></div><div class="v">${brl(r.val)}<small>${r.p}/${r.n}</small></div></div>`});
 $('#ls').innerHTML=h||'<p class="mu c">Nenhuma despesa nesta consulta.<br>Toque em + para incluir.</p>';
 $('#s1').textContent=brl(tot);$('#s2').textContent=brl(pg);$('#s3').textContent=brl(tot-pg);
 $('#bl').innerHTML=Object.entries(it).sort((a,c)=>c[1]-a[1]).map(([k,v])=>`<div class="bi"><span>${esc(k)}</span><b>${brl(v)}</b></div>`).join('')||'<p class="mu">Sem itens.</p>';
 $('#il').innerHTML=[...new Set(D.map(r=>r.item))].sort().map(k=>`<option value="${esc(k)}">`).join('');
}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;render()});
$('#pv').onclick=()=>{cur=addM(cur+'-01',-1).slice(0,7);render()};
$('#nx').onclick=()=>{cur=addM(cur+'-01',1).slice(0,7);render()};
['#q','#st','#bs','#de','#ate'].forEach(s=>['input','change'].forEach(ev=>$(s).addEventListener(ev,render)));
$('#ls').onclick=e=>{const c=e.target.closest('[data-ck]'),d=e.target.closest('[data-ed]');
 if(c){const r=D.find(x=>x.id===c.dataset.ck);r.pago=!r.pago;save();render()}else if(d)openF(D.find(x=>x.id===d.dataset.ed))};

function pw(){
 if(eid){$('#pw').textContent='';return}
 const n=Math.max(1,Math.min(60,+$('#fn').value||1)),c=money($('#fv').value),d=$('#fd').value,tt=$('#ft').value==='t';
 if(!c||!d){$('#pw').textContent='';return}
 $('#pw').textContent=`${n}× ${brl(tt?Math.floor(c/n):c)} · ${fdt(d)}${n>1?' a '+fdt(addM(d,n-1)):''} · total ${brl(tt?c:c*n)}`;
}
['#fv','#ft','#fn','#fd'].forEach(s=>$(s).addEventListener('input',pw));
function openF(r){
 const e=!!r;eid=e?r.id:null;
 $('#ft2').textContent=e?'Editar despesa':'Nova despesa';
 $('#fi').value=e?r.item:'';$('#fv').value=e?(r.val/100).toFixed(2).replace('.',','):'';
 $('#fd').value=e?r.venc:today();$('#fx').value=e?r.inc:today();$('#fn').value=1;$('#ft').value='p';
 $('#lv').textContent=e?`Vencimento (parcela ${r.p}/${r.n})`:'1º vencimento';
 $('#fp').checked=e&&r.pago;$('#lt').hidden=$('#ln').hidden=e;$('#lp').hidden=!e;
 const g=e?D.filter(x=>x.g===r.g).length:0;
 $('#la').hidden=g<2;$('#x1').hidden=!e;$('#x2').hidden=g<2;
 pw();$('#fm').showModal();
}
$('#fab').onclick=()=>openF(null);
$('#cn').onclick=()=>$('#fm').close();
$('#f').onsubmit=e=>{
 e.preventDefault();
 const item=$('#fi').value.trim(),c=money($('#fv').value),d=$('#fd').value,inc=$('#fx').value||today();
 if(!item||!c||!d)return alert('Preencha item, valor e vencimento.');
 if(eid){
  const r=D.find(x=>x.id===eid);Object.assign(r,{val:c,venc:d,inc,pago:$('#fp').checked});
  if(!$('#la').hidden&&$('#fa').checked)D.forEach(x=>{if(x.g===r.g)x.item=item});else r.item=item;
 }else{
  const n=Math.max(1,Math.min(60,+$('#fn').value||1)),tt=$('#ft').value==='t',b=tt?Math.floor(c/n):c,ex=tt?c-b*n:0,g=uid();
  for(let i=0;i<n;i++)D.push({id:g+i,g,item,inc,venc:addM(d,i),val:b+(i<ex?1:0),p:i+1,n,pago:false});
  mode='m';cur=d.slice(0,7);$('#bs').value='venc';$('#q').value='';$('#st').value='';
 }
 save();$('#fm').close();render();
};
$('#x1').onclick=()=>{if(confirm('Excluir esta parcela?')){D=D.filter(x=>x.id!==eid);save();$('#fm').close();render()}};
$('#x2').onclick=()=>{const g=D.find(x=>x.id===eid).g;if(confirm('Excluir TODAS as parcelas desta despesa?')){D=D.filter(x=>x.g!==g);save();$('#fm').close();render()}};

async function out(n,t,x){
 const f=new File([x],n,{type:t});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(e){if(e.name==='AbortError')return}}
 const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=n;a.click();
}
$('#mn').onclick=()=>$('#mu').showModal();
$('#m0').onclick=()=>$('#mu').close();
$('#m1').onclick=()=>out('despesas-backup-'+today()+'.json','application/json',JSON.stringify(D));
$('#m2').onclick=()=>$('#fl').click();
$('#m3').onclick=()=>{
 const r=['Inclusão;Item;Vencimento;Valor;Parcela;Situação',...filt().map(x=>[fdt(x.inc),'"'+x.item.replace(/"/g,'""')+'"',fdt(x.venc),(x.val/100).toFixed(2).replace('.',','),x.p+'/'+x.n,x.pago?'Paga':'Pendente'].join(';'))];
 out('despesas-'+today()+'.csv','text/csv','\ufeff'+r.join('\r\n'));
};
$('#m4').onclick=()=>{if(confirm('Apagar TODOS os dados deste aparelho?')&&confirm('Tem certeza? Não dá para desfazer.')){D=[];save();$('#mu').close();render()}};
$('#fl').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 try{const a=JSON.parse(await f.text());if(!Array.isArray(a))throw 0;
  const ids=new Set(D.map(x=>x.id));let n=0;
  a.forEach(x=>{if(x&&x.id&&x.item&&x.venc&&x.inc&&Number.isInteger(x.val)&&!ids.has(x.id)){D.push(x);n++}});
  save();render();alert(n+' lançamentos restaurados.');
 }catch(_){alert('Arquivo de backup inválido.')}
 e.target.value='';$('#mu').close();
};
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
</script>
</body>
</html>
